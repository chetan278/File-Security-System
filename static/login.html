<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Portal - Secure Login & Recovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <div id="pageIcon" class="w-12 h-12 bg-blue-600/20 rounded-xl flex items-center justify-center mx-auto text-blue-500 text-2xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 id="pageTitle" class="text-xl font-bold tracking-wide">Aegis Security Portal</h1>
            <p id="pageSubtitle" class="text-xs text-slate-400">Enter credentials to access portal</p>
        </div>

        <!-- LOGIN FORM -->
        <div id="viewLogin" class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Username</label>
                <input type="text" id="loginUsername" placeholder="e.g. Madhvan" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex justify-between items-center text-xs">
                <span class="text-slate-400">Direct Dashboard Access</span>
                <button onclick="switchView('forgotStep1')" class="text-blue-400 hover:underline">Forgot Password?</button>
            </div>

            <button onclick="doLogin()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl text-xs font-bold text-white shadow transition">
                Secure Login
            </button>
        </div>

        <!-- FORGOT PASSWORD STEP 1: USERNAME -->
        <div id="viewForgotStep1" class="space-y-4 hidden">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Enter Username</label>
                <input type="text" id="fpUsername" placeholder="e.g. Madhvan" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="fpNextToEmail()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl text-xs font-bold text-white shadow transition">
                Next: Enter Email
            </button>
            <button onclick="switchView('login')" class="w-full bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-xs font-semibold text-slate-300 transition">
                Back to Login
            </button>
        </div>

        <!-- FORGOT PASSWORD STEP 2: EMAIL -->
        <div id="viewForgotStep2" class="space-y-4 hidden">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Enter Registered Email</label>
                <input type="email" id="fpEmail" placeholder="e.g. madhvanisharma1706@gmail.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="fpRequestOtp()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl text-xs font-bold text-white shadow transition">
                Send OTP to Email
            </button>
            <button onclick="switchView('forgotStep1')" class="w-full bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-xs font-semibold text-slate-300 transition">
                Back
            </button>
        </div>

        <!-- FORGOT PASSWORD STEP 3: OTP -->
        <div id="viewForgotStep3" class="space-y-4 hidden">
            <div class="p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs text-amber-400 text-center">
                <i class="fa-solid fa-envelope mr-1"></i> Check your email for the recovery code.
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Enter 6-Digit OTP</label>
                <input type="text" id="fpOtp" maxlength="6" placeholder="123456" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-center tracking-widest text-lg font-mono text-emerald-400 focus:outline-none focus:border-emerald-500">
            </div>
            <button onclick="fpVerifyOtp()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl text-xs font-bold text-white shadow transition">
                Verify OTP
            </button>
            <button onclick="switchView('forgotStep2')" class="w-full bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-xs font-semibold text-slate-300 transition">
                Back
            </button>
        </div>

        <!-- FORGOT PASSWORD STEP 4: NEW PASSWORD -->
        <div id="viewForgotStep4" class="space-y-4 hidden">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">New Password</label>
                <input type="password" id="fpNewPass" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Confirm New Password</label>
                <input type="password" id="fpConfirmPass" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="fpResetPassword()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl text-xs font-bold text-white shadow transition">
                Reset Password & Save
            </button>
        </div>

        <div id="globalError" class="text-xs text-red-400 text-center font-medium hidden"></div>
    </div>

    <script>
        let recoveryData = { username: '', email: '', otp: '' };

        function showError(msg) {
            const err = document.getElementById('globalError');
            err.innerText = msg;
            err.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('globalError').classList.add('hidden');
        }

        function switchView(viewName) {
            hideError();
            ['viewLogin', 'viewForgotStep1', 'viewForgotStep2', 'viewForgotStep3', 'viewForgotStep4'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });

            const title = document.getElementById('pageTitle');
            const subtitle = document.getElementById('pageSubtitle');
            const icon = document.getElementById('pageIcon');

            if(viewName === 'login') {
                document.getElementById('viewLogin').classList.remove('hidden');
                title.innerText = 'Aegis Security Portal';
                subtitle.innerText = 'Enter credentials to access portal';
                icon.className = 'w-12 h-12 bg-blue-600/20 rounded-xl flex items-center justify-center mx-auto text-blue-500 text-2xl';
                icon.innerHTML = '<i class="fa-solid fa-shield-halved"></i>';
            } else if(viewName === 'forgotStep1') {
                document.getElementById('viewForgotStep1').classList.remove('hidden');
                title.innerText = 'Password Recovery';
                subtitle.innerText = 'Step 1: Enter account username';
                icon.className = 'w-12 h-12 bg-amber-600/20 rounded-xl flex items-center justify-center mx-auto text-amber-500 text-2xl';
                icon.innerHTML = '<i class="fa-solid fa-key"></i>';
            } else if(viewName === 'forgotStep2') {
                document.getElementById('viewForgotStep2').classList.remove('hidden');
                subtitle.innerText = 'Step 2: Enter registered email';
            } else if(viewName === 'forgotStep3') {
                document.getElementById('viewForgotStep3').classList.remove('hidden');
                subtitle.innerText = 'Step 3: Enter the code sent to your email';
            } else if(viewName === 'forgotStep4') {
                document.getElementById('viewForgotStep4').classList.remove('hidden');
                subtitle.innerText = 'Step 4: Create new password';
            }
        }

        async function doLogin() {
            hideError();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if(!username || !password) { showError('Enter username and password!'); return; }

            const res = await fetch('/api/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if(res.ok || data.success) {
                window.location.href = '/dashboard';
            } else {
                showError(data.error || 'Login failed!');
            }
        }

        function fpNextToEmail() {
            hideError();
            const username = document.getElementById('fpUsername').value.trim();
            if(!username) { showError('Enter username!'); return; }
            recoveryData.username = username;
            switchView('forgotStep2');
        }

        async function fpRequestOtp() {
            hideError();
            const email = document.getElementById('fpEmail').value.trim();
            if(!email) { showError('Enter email!'); return; }
            recoveryData.email = email;

            const res = await fetch('/api/forgot/send-otp', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: recoveryData.username, email: recoveryData.email })
            });
            const data = await res.json();

            if(res.ok) {
                switchView('forgotStep3');
            } else {
                showError(data.error || 'Username not found!');
            }
        }

        async function fpVerifyOtp() {
            hideError();
            const otp = document.getElementById('fpOtp').value.trim();
            if(otp.length !== 6) { showError('Enter valid 6-digit OTP!'); return; }
            recoveryData.otp = otp;

            const res = await fetch('/api/forgot/verify-otp', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: recoveryData.username, otp })
            });
            const data = await res.json();

            if(res.ok) {
                switchView('forgotStep4');
            } else {
                showError(data.error || 'Invalid OTP!');
            }
        }

        async function fpResetPassword() {
            hideError();
            const newPass = document.getElementById('fpNewPass').value.trim();
            const confirmPass = document.getElementById('fpConfirmPass').value.trim();

            if(!newPass || !confirmPass) { showError('Fill all password fields!'); return; }
            if(newPass !== confirmPass) { showError('Passwords do not match!'); return; }

            const res = await fetch('/api/forgot/reset', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: recoveryData.username, new_password: newPass })
            });
            const data = await res.json();

            if(res.ok) {
                alert('Password updated successfully! Please login.');
                switchView('login');
            } else {
                showError(data.error || 'Reset failed!');
            }
        }
    </script>
</body>
</html>
